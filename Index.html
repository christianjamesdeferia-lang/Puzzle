<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Black Cipher</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: "Courier New", monospace;
    background: #080808; color: #eee; display: grid; place-items: center;
  }
  .wrap { width: min(900px, 92vw); padding: 28px 0; }
  h1 { letter-spacing: 8px; text-align: center; font-size: clamp(28px,6vw,54px); margin: 0 0 8px; }
  .sub { text-align:center; color:#888; margin-bottom:28px; }
  .panel {
    border: 1px solid #444; background:#111; padding:24px;
    box-shadow: 0 0 35px rgba(255,255,255,.04);
  }
  .cipher {
    background:#050505; border:1px solid #292929; padding:20px;
    font-size: clamp(17px,3vw,25px); line-height:1.7; word-break:break-word;
  }
  .hint { color:#777; font-size:13px; margin-top:16px; }
  .row { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  input {
    flex:1; min-width:220px; padding:13px; background:#000; color:#fff;
    border:1px solid #555; font:inherit; outline:none;
  }
  button {
    padding:13px 20px; background:#eee; color:#000; border:0;
    font:inherit; font-weight:bold; cursor:pointer;
  }
  button:hover { background:#ccc; }
  #result { margin-top:18px; min-height:24px; }
  .success { color:#000; background:#fff; padding:18px; font-family:Arial,sans-serif; }
  .wrong { color:#888; }
  .section-title { color:#aaa; margin:24px 0 8px; }
  code { color:#ddd; }
</style>
</head>
<body>
<div class="wrap">
  <h1>THE BLACK CIPHER</h1>
  <div class="sub">simple to see • annoying to solve</div>

  <div class="panel">
    <div class="section-title">CIPHER</div>
    <div class="cipher" id="cipher">Mrq qeb zobxqlo kxjb.</div>

    <div class="section-title">DECIPHER</div>
    <p>Something is hiding in plain sight. Decode the message, then enter the hidden answer below.</p>

    <div class="row">
      <input id="answer" autocomplete="off" placeholder="Enter the answer...">
      <button onclick="check()">DECIPHER</button>
    </div>
    <div id="result"></div>

    <div class="hint">
      Hint: Why do you need a fucking hint? its absolutely easy 
    </div>
  </div>
</div>

<script>
  // The visible cipher uses a Caesar shift of +3.
  // Decoding it gives: "Put the creators name."
  // The actual puzzle answer is hidden in the repeated pattern:
  // Take every 5th character of the raw cipher (letters only), then Caesar-decode.
  const raw = "Mrq qeb zobxqlo kxjb";
  const shift = 3;

  function caesar(s, n) {
    return s.replace(/[A-Z]/g, c =>
      String.fromCharCode((c.charCodeAt(0)-65-n+26)%26+65)
    );
  }

  // Actual intended answer: "CJ"
  const accepted = ["wasted"];

  function check() {
    const val = document.getElementById("answer").value.trim().toLowerCase();
    const out = document.getElementById("result");
    if (accepted.includes(val)) {
      out.className = "success";
      out.textContent = "Lol I wasted ur time XD\n\nBy:cj";
      out.style.whiteSpace = "pre-line";
    } else {
      out.className = "wrong";
      out.textContent = "Nope. The cipher is lying to you. Try again.";
    }
  }

  document.getElementById("answer").addEventListener("keydown", e => {
    if (e.key === "Enter") check();
  });
</script>
</body>
</html>
